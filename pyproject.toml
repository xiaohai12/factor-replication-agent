[project]
name = "factor-replication-agent"
version = "0.1.0"
description = "Controlled Meta-Coder Agents for Auditable Factor Backtesting Pipeline Generation and Implementation-Gap Attribution"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.30",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    # Build-time only: fetch Ken French FF/rf factors -> snapshot parquet.
    # Never imported at run time (see scripts/fetch_ff_factors.py).
    "pandas-datareader>=0.10",
]
# Statistical libraries for metrics/estimators. Pinned for reproducible,
# auditable numbers. Statistical computation only -- no empirical/portfolio
# decisions (see plan.md "Tooling / libraries").
research = [
    "statsmodels==0.14.6",
]
# FastAPI backend for the new web UI (frontend/ + backend/), replacing the
# Streamlit app.py dashboard. See docs/decision-log.md for the migration plan.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
